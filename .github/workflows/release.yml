name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: anycaster-linux-amd64
            deb_arch: amd64
            rpm_arch: x86_64
          - target: aarch64-unknown-linux-gnu
            artifact: anycaster-linux-arm64
            deb_arch: arm64
            rpm_arch: aarch64
          - target: armv7-unknown-linux-gnueabihf
            artifact: anycaster-linux-armv7
            deb_arch: armhf
            rpm_arch: armv7hl
    steps:
      - uses: actions/checkout@v7
      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = .*/version = \"${VERSION}\"/" Cargo.toml
          cargo generate-lockfile
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross and packaging tools
        run: |
          cargo install cross --git https://github.com/cross-rs/cross
          cargo install cargo-deb cargo-generate-rpm
      - name: Build
        run: cross build --release --target ${{ matrix.target }}
      - name: Rename binary
        run: cp target/${{ matrix.target }}/release/anycaster ${{ matrix.artifact }}
      - name: Build deb package
        run: cargo deb --no-build --no-strip --target ${{ matrix.target }}
      - name: Build rpm package
        run: cargo generate-rpm --target ${{ matrix.target }}
      - name: Collect packages
        run: |
          mkdir -p packages
          cp ${{ matrix.artifact }} packages/
          cp target/${{ matrix.target }}/debian/*.deb packages/
          cp target/${{ matrix.target }}/generate-rpm/*.rpm packages/
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: packages/*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
